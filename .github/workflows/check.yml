name: check

on:
  push:
    branches: [main]   # agents push to night/* branches dozens of times per round: PRs cover them
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"  # Nightly at 02:00 UTC

jobs:
  docker:
    # The jury's container path: build the image, run the single check with no network.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t auditenv .
      - name: Run the check in the container (no network)
        run: docker run --rm --network none auditenv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify isolated policy image and closed episodes
        run: |
          docker build --target policy -t genesis-policy .
          docker run --rm --read-only --network none --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint python genesis-policy -c '
          import importlib.util, os
          from pathlib import Path
          assert os.getuid() != 0
          assert "AUDITENV_SECRET" not in os.environ
          assert not Path("/app").exists() and not Path("/policy/episodes").exists()
          assert all(importlib.util.find_spec(m) is None for m in ("judge_adapter", "auditenv.matcher", "auditenv.generator", "auditenv.policies.oracle"))
          '
          python3 -m auditenv.jury_run --policy-image genesis-policy --json /tmp/isolated.json
          python3 -c 'import json; r=json.load(open("/tmp/isolated.json")); assert all(v["episodes"] == 20 for v in r.values()) and r["reconcile"]["f1"] == r["oracle"]["f1"] == 1'
  python:
    # The same check without Docker, on plain Python 3.11 (stdlib only, nothing to install).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Single check
        run: python -m auditenv.check --json /tmp/check.json
      - name: Check documentation drift
        run: python scripts/sync_docs.py --check --json /tmp/check.json
      - name: Verifier on 600 episodes and on the exported splits
        run: |
          python -m auditenv.verify --seeds 0-199
          python -m auditenv.verify --dir episodes/train
          python -m auditenv.verify --dir episodes/dev
          python -m auditenv.verify --dir episodes/hard
      - name: Seed sweep (1 000 seeds default, 200 seeds hard)
        run: |
          python -m auditenv.fuzz --seeds 0-999
          python -m auditenv.fuzz --seeds 0-199 --hard

  matrix-fuzz:
    # P3: Nightly and manual matrix fuzz across Python 3.11 patch versions on ubuntu-24.04
    name: "Matrix fuzz 0-4999 (py${{ matrix.python-version }})"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.17", "3.11.18"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Seed sweep (5 000 seeds default)
        run: python -m auditenv.fuzz --seeds 0-4999
